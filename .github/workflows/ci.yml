name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests (API + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: printflow
          POSTGRES_PASSWORD: printflow
          POSTGRES_DB: printflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U printflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:int
        env:
          TEST_DATABASE_URL: postgres://printflow:printflow@localhost:5432/printflow_test

  stack:
    name: Docker stack (build, smoke, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_SHA: ${{ github.sha }}
      # Throwaway account for this run only; the database is deleted afterwards.
      # The browser tests sign in and register many accounts within a minute.
      AUTH_RATE_LIMIT_MAX: '1000'
      E2E_ADMIN_EMAIL: ci-admin@example.com
      E2E_ADMIN_PASSWORD: ci-only-password-12345
      SMOKE_EMAIL: ci-admin@example.com
      SMOKE_PASSWORD: ci-only-password-12345
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Validate the public-demo overlay
        run: docker compose -f compose.yaml -f compose.public.yaml config --quiet

      # The exact stack a developer starts locally: Postgres + app in containers.
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Create the CI admin account
        run: >-
          docker compose exec -T -e PF_PASSWORD="$E2E_ADMIN_PASSWORD" app
          node server/auth/create-user.ts "$E2E_ADMIN_EMAIL" "CI Admin" admin
      - name: Smoke test
        run: npm run smoke
        env:
          EXPECT_VERSION: ${{ github.sha }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
