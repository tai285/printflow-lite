# Public demo overlay: publishes the local stack on the internet through a free
# Cloudflare quick tunnel (no account, no domain, no open router ports).
#
#   npm run public:up      start (prints the public URL)
#   npm run public:url     print the current URL again
#   npm run public:down    stop publishing
#
# The URL looks like https://random-words.trycloudflare.com and changes every
# time the tunnel restarts. See docs/DEPLOYMENT.md for a stable-address upgrade.
services:
  app:
    environment:
      # Nobody is logged in, so wipe visitor data hourly and limit writes.
      DEMO_RESET_MINUTES: '60'
      RATE_LIMIT_MAX: '30'
      # One reverse proxy (the tunnel) sits in front of the app.
      TRUST_PROXY: '1'
      # Set to a permanent public address to make the site indexable.
      SITE_URL: ${SITE_URL:-}

  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
